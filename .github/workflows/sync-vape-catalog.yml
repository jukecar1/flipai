name: Sync Royal Vape Mart catalog from Google Sheet

on:
  schedule:
    - cron: '41 * * * *'   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the sheet
        working-directory: vape
        env:
          CATALOG_SHEET_CSV_URL: ${{ secrets.CATALOG_SHEET_CSV_URL_VAPE }}
        run: node scripts/sync-catalog.js
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- vape/src/products.json; then echo "No catalog changes."; exit 0; fi
          git config user.name "catalog-sync"
          git config user.email "catalog-sync@users.noreply.github.com"
          git add vape/src/products.json
          git commit -m "Update Royal Vape Mart catalog from Google Sheet"
          git push
